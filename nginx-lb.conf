# Cloud Sentinel — Backend Load Balancer
# Routes traffic across 3 backend nodes with sticky sessions.
# ip_hash ensures the same client always hits the same node,
# which is critical because each node has its own in-memory state
# (AI model baseline, alert store, SARIMA data).

upstream backend_cluster {
    ip_hash;  # sticky sessions — same client → same backend node

    server backend-1:8000;
    server backend-2:8000;
    server backend-3:8000;
}

server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /health {
        return 200 '{"status": "load_balancer_ok"}';
        add_header Content-Type application/json;
    }

    # Route all traffic to the backend cluster
    location / {
        proxy_pass http://backend_cluster;

        # Pass client info to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Identify which backend node handled the request
        add_header X-Backend-Node $upstream_addr always;

        # Timeouts (Layer 2 deep scan can take a moment)
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }
}