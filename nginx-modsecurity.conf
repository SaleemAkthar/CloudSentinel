# Cloud Sentinel — ModSecurity Nginx Configuration
# ==================================================
# This file tells Nginx how to run with ModSecurity.
# All traffic comes in here, gets inspected, then forwarded
# to your Cloud Sentinel backend load balancer.

# The backend — your existing Cloud Sentinel load balancer
upstream cloud_sentinel_lb {
    # This is the docker-compose service name of your existing load balancer
    server backend-lb:80;
    keepalive 32;
}

server {
    listen      80;
    server_name localhost;

    # Turn ModSecurity on for this server
    modsecurity     on;
    modsecurity_rules_file /etc/modsecurity.d/modsec-override.conf;

    # ── Main proxy — all traffic ──────────────────────────────────────
    location / {
        # Forward to Cloud Sentinel after WAF inspection
        proxy_pass         http://cloud_sentinel_lb;

        # Pass real client IP through to Cloud Sentinel
        # This is important — Cloud Sentinel uses IP for detection
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Tell backend this traffic passed ModSecurity
        proxy_set_header   X-WAF-ModSecurity "passed";

        # Timeouts — keep responses fast
        proxy_connect_timeout  3s;
        proxy_send_timeout     10s;
        proxy_read_timeout     30s;

        # If ModSecurity blocks a request — return this response
        # The 403 never reaches Cloud Sentinel or your Lambda
        error_page 403 = @waf_blocked;
    }

    # ── Health check — skip WAF inspection ───────────────────────────
    # The ALB health checks should not be blocked by WAF rules
    location /health {
        modsecurity off;
        return 200 '{"waf":"modsecurity","status":"running"}';
        add_header Content-Type application/json;
    }

    # ── WAF blocked response ──────────────────────────────────────────
    location @waf_blocked {
        add_header Content-Type application/json always;
        return 403 '{"blocked":true,"waf":"ModSecurity","reason":"Request matched attack signature"}';
    }
}
```

