## File 3 — `modsec-main.conf`

Create this file in your root folder.
```
# Cloud Sentinel — ModSecurity Rules Configuration
# =================================================
# This file controls how ModSecurity behaves.
# It includes the OWASP Core Rule Set which contains
# 3000+ rules for detecting known attacks.

# ── Engine Mode ───────────────────────────────────────────────────────────────
# DetectionOnly = log but DO NOT block (safe to start with, change later)
# On            = log AND block (full protection)
# Start with DetectionOnly to see what it catches, then switch to On
SecRuleEngine DetectionOnly

# ── Request Body Inspection ───────────────────────────────────────────────────
# Inspect request bodies (POST data) for attacks
SecRequestBodyAccess On
SecRequestBodyLimit  13107200
SecRequestBodyNoFilesLimit 131072

# ── Response Body Inspection ──────────────────────────────────────────────────
SecResponseBodyAccess On
SecResponseBodyLimit  524288

# ── Logging ───────────────────────────────────────────────────────────────────
# Log all detected attacks — useful for Cloud Sentinel to analyse
SecAuditEngine        RelevantOnly
SecAuditLog           /var/log/modsecurity/audit.log
SecAuditLogParts      ABCFHZ
SecAuditLogType       Serial

# ── Include OWASP Core Rule Set ───────────────────────────────────────────────
# These are the actual attack detection rules
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# ── Custom Rules for Cloud Sentinel ──────────────────────────────────────────

# Rule 1: Block SQL injection in any parameter
# Catches attacks like: ' OR 1=1 -- or DROP TABLE users
SecRule ARGS "@detectSQLi" \
    "id:10001,\
     phase:2,\
     block,\
     msg:'SQL Injection detected in request parameters',\
     logdata:'Matched data: %{MATCHED_VAR} in %{MATCHED_VAR_NAME}',\
     severity:'CRITICAL',\
     tag:'attack-sqli'"

# Rule 2: Block obvious crypto mining patterns in function names
# Catches attackers trying to inject function names
SecRule ARGS:function_name "@rx (mine|hash|xmr|monero|bitcoin|crypto)" \
    "id:10002,\
     phase:2,\
     block,\
     msg:'Suspicious function name — possible crypto mining injection',\
     severity:'HIGH',\
     tag:'attack-crypto'"

# Rule 3: Anomalous duration values — flag impossibly high values
# Legitimate Lambda calls should not report 100,000ms duration
SecRule ARGS:duration "@gt 60000" \
    "id:10003,\
     phase:2,\
     block,\
     msg:'Anomalous duration value — possible data manipulation',\
     severity:'MEDIUM',\
     tag:'data-manipulation'"

# Rule 4: Block requests missing Content-Type for POST
SecRule REQUEST_METHOD "@streq POST" \
    "id:10004,\
     phase:1,\
     chain,\
     msg:'POST request missing Content-Type header'"
    SecRule &REQUEST_HEADERS:Content-Type "@eq 0" \
        "block,\
         severity:'MEDIUM'"