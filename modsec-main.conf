SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecResponseBodyAccess On
SecResponseBodyLimit 524288
SecAuditEngine RelevantOnly
SecAuditLogParts ABCFHZ
SecAuditLogType Serial
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
SecRule ARGS "@detectSQLi" "id:10001,phase:2,block,msg:'SQL Injection',severity:CRITICAL"
SecRule ARGS:function_name "@rx (?i)(mine|hash|xmr|monero|bitcoin|crypto)" "id:10002,phase:2,block,msg:'Suspicious function name',severity:HIGH"
SecRule ARGS:duration "@gt 60000" "id:10003,phase:2,block,msg:'Anomalous duration',severity:MEDIUM"