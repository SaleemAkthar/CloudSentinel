# Cloud Sentinel — ModSecurity Rules Configuration
# =================================================

# Engine Mode
# DetectionOnly = log but do not block yet (safe to start with)
# Change to: SecRuleEngine On    when you want to actually block
SecRuleEngine DetectionOnly

# Request body inspection
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Response body inspection
SecResponseBodyAccess On
SecResponseBodyLimit 524288

# Logging
SecAuditEngine RelevantOnly
SecAuditLogParts ABCFHZ
SecAuditLogType Serial

# Include OWASP Core Rule Set
# These files already exist inside the owasp/modsecurity-crs image
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# Custom Rule 1 — Block SQL injection in any parameter
SecRule ARGS "@detectSQLi" \
    "id:10001,\
     phase:2,\
     block,\
     msg:'SQL Injection detected',\
     severity:'CRITICAL',\
     tag:'attack-sqli'"

# Custom Rule 2 — Block suspicious function names
SecRule ARGS:function_name "@rx (mine|hash|xmr|monero|bitcoin|crypto|' OR|DROP TABLE)" \
    "id:10002,\
     phase:2,\
     block,\
     msg:'Suspicious function name',\
     severity:'HIGH',\
     tag:'attack-injection'"

# Custom Rule 3 — Block impossibly high duration values
SecRule ARGS:duration "@gt 60000" \
    "id:10003,\
     phase:2,\
     block,\
     msg:'Anomalous duration value — possible data manipulation',\
     severity:'MEDIUM',\
     tag:'data-manipulation'"