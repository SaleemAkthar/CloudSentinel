# Cloud Sentinel — Clustered Setup
# ===================================
# Architecture:
#   frontend (React) → backend-lb (nginx) → backend-1, backend-2, backend-3
#
# Usage:
#   docker-compose up --build        (start everything)
#   docker-compose up --build -d     (start in background)
#   docker-compose down              (stop everything)
#   docker-compose logs backend-1    (view logs for one node)
#   docker-compose ps                (see running containers)
#
# Endpoints:
#   http://localhost:3000             → Dashboard (frontend)
#   http://localhost:8080             → Backend API (via load balancer)
#   http://localhost:8080/status      → Health check (routed to one node)
#   http://localhost:8080/health      → Load balancer health

version: "3.8"

services:

  # ── Backend Node 1 ──────────────────────────────────────────────────
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cs-backend-1
    environment:
      - CORS_ORIGINS=*
      - PORT=8000
      - NODE_ID=backend-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Backend Node 2 ──────────────────────────────────────────────────
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cs-backend-2
    environment:
      - CORS_ORIGINS=*
      - PORT=8000
      - NODE_ID=backend-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Backend Node 3 ──────────────────────────────────────────────────
  backend-3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cs-backend-3
    environment:
      - CORS_ORIGINS=*
      - PORT=8000
      - NODE_ID=backend-3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Load Balancer (nginx) ───────────────────────────────────────────
  backend-lb:
    image: nginx:alpine
    container_name: cs-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (React + nginx) ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cs-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-lb
    restart: unless-stopped
    
# ── ModSecurity WAF ─────────────────────────────────────────────────
  # Rules-based WAF. Blocks known attack signatures.
  # Sits in front of your backend load balancer.
  # Traffic comes in on port 8081 → WAF inspects → forwards to backend-lb
  modsecurity-waf:
    build:
      context: .
      dockerfile: Dockerfile.modsecurity
    container_name: cs-modsecurity
    ports:
      - "8081:80"
    depends_on:
      backend-lb:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./nginx-modsecurity.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./modsec-main.conf:/etc/modsecurity.d/modsec-override.conf:ro

  # ── OpenAppsec WAF ───────────────────────────────────────────────────
  # ML-based WAF. Learns your traffic and blocks anomalies.
  # Sits in front of ModSecurity.
  # Traffic comes in on port 8082 → OpenAppsec → ModSecurity → backend-lb
  open-appsec:
    image: openappsec/agent:latest
    container_name: cs-openappsec
    ports:
      - "8082:80"
    environment:
      - APPSEC_MODE=prevent-learn
      - UPSTREAM_URL=http://modsecurity-waf:80
    volumes:
      - ./openappsec-policy.json:/ext/appsec/local_policy.json:ro
    depends_on:
      - modsecurity-waf
    restart: unless-stopped